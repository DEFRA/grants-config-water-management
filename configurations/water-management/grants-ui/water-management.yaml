  # 1.10 Score results
  - title: Your eligibility score
    id: fd417ccc-c671-49f3-8b79-4ab32aabb71c
    path: /score-results
    section: 8e00ff98-4e79-4b9d-9913-3694af7f40ca
    controller: ScoreResultsTaskPageController
    config:
      excludeFromTaskCompletion: true
      derivedState:
        stateKeys:
          - totalScore
          - sectorScore
          - scarcityScore
          - collaborationScore
          - planningAbstractionScore
        calculationInputs:
          - sectorsIrrigated
          - projectLocated__easting
          - projectLocated__northing
          - businessesUsingWater
          - havePlanningPermission
          - haveAbstractionLicence
        requiresAcknowledgement: true
    components:
      - name: scoreResultsContent
        id: 91b42eac-cc5a-48ff-a050-9af715c2e0ed
        type: Html
        content: >
          <p class="govuk-body">Based on the answers provided, your project has scored</p>
          <div class="govuk-inset-text">
            <p class="govuk-body govuk-!-font-size-24 govuk-!-font-weight-bold">{{ context.state.additionalAnswers.totalScore }} out of 100</p>
          </div>
          <div class="govuk-warning-text">
            <span class="govuk-warning-text__icon" aria-hidden="true">i</span>
            <strong class="govuk-warning-text__text">
              <span class="govuk-visually-hidden">Warning</span>
              The likelihood of your application being successful will depend on the total number of applications received for this grant, and the relative scores of all projects as they relate to RPA's policy objectives and budget.
            </strong>
          </div>
  # ==========================================
  # Section 2: Project details and estimated costs
  # ==========================================
  # 2.1 Expected project start date
  - title: When do you expect the project work to start?
    id: 7cb1a024-1ce6-45ac-b9ca-009f4848b5e5
