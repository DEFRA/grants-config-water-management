        content: >
          <p class="govuk-body">You cannot continue with your application.</p>
          <p class="govuk-body">The crops you plan to irrigate must be included in one of the eligible crop categories.</p>
          <p class="govuk-body"><a href="https://www.gov.uk/government" class="govuk-link" target="_blank">Check what other grants you may be eligible for (opens in a new tab)</a></p>
  # 1.2 Where project located
  - title: Tell us where your project is
    id: 1b1a1add-7f33-4cf2-9b0e-6ed5cd08ed08
    path: /where-project-located
    section: 8e00ff98-4e79-4b9d-9913-3694af7f40ca
    controller: LocationValidateController
    components:
      - name: projectLocatedInfo
        id: b42ec3aa-23be-4ff6-99e2-6631f423b297
        type: Html
        content: >
          <p class="govuk-body">Your project must be in England to be eligible for a grant.</p>
          <p class="govuk-body">Select the centre of your project on the map (for example the centre of your reservoir). If you’re planning more than one reservoir, water tank or underground distribution main, select the location of the larger reservoir or major part of your project.</p>
          <details class="govuk-details" data-module="govuk-details">
            <summary class="govuk-details__summary">
              <span class="govuk-details__summary-text">
                Help with using the map
              </span>
            </summary>
            <div class="govuk-details__text">
              <p class="govuk-body">There are tools on the map to help you use it. You can:</p>
              <ul class="govuk-list govuk-list--bullet govuk-!-margin-bottom-6">
                <li>use the search icon on the top right of the map to search by postcode</li>
                <li>use the map layers icon on the top left of the map to switch to an aerial view</li>
                <li>use the plus and minus tools to zoom in and out</li>
                <li>select the diagonal arrows icon to switch to a full-screen view of the map.</li>
              </ul>
              <p class="govuk-body">If you are unable to use the map, you can find the co-ordinates using an address lookup service, postcode search or an Ordnance Survey mapping tool.</p>
            </div>
          </details>
      - name: projectLocated
        id: 9e3b7d5a-4c4f-4d7e-9f2a-ab8c9d5e6f70
        title: Where is your project?
        hint: The Easting and Northing co-ordinates of the grid reference will appear when you select your location on the map. You can use these co-ordinates to find this location on another map (or keep them as a reference).
        type: EastingNorthingField
        options:
          required: true
          showApproximateLocation: true
          approximateLocationPrefix: 'Point selected area:'
        shortDescription: Project location
      - name: confirmCorrectLocationSelected
        id: 8bbf8228-ed1e-46ab-9be6-c5e5827d7984
        title: Confirm
        type: DeclarationField
        options:
          required: true
          declarationConfirmationLabel: I confirm I have selected the right location on the map
        shortDescription: Confirm project location
  # See EXTRA PAGES for where-project-located exit page
  # 1.3 Work started yet
  - title: What work have you done on your project?
    id: c995d1bb-1c7f-44d5-9a0a-576caa6f66e7
    path: /work-started-yet
    section: 8e00ff98-4e79-4b9d-9913-3694af7f40ca
    controller: TaskPageController
    components:
      - name: workStartedYet
        id: 6d91fee3-d23c-4e05-aa1e-89f23b5f0a1f
        title: What work have you done on your project?
        type: RadiosField
        list: b1eb45b7-ce4e-4ecf-8d2e-3fe4945348da
        options:
          required: true
        shortDescription: Status of work
      - name: eligibilityContent
        id: 4cd0820a-3f0a-4fbd-87aa-6830dcf25963
        type: Html
        content: >
          <details class="govuk-details" data-module="govuk-details">
            <summary class="govuk-details__summary">
              <span class="govuk-details__summary-text">
                Eligibility
              </span>
            </summary>
            <div class="govuk-details__text">
              <p class="govuk-body">You will invalidate your application if you start the project or commit to any costs (such as placing orders) before you receive a funding agreement.</p>
              <p class="govuk-body">Before you start the project, you can:</p>
              <ul class="govuk-list govuk-list--bullet govuk-!-margin-bottom-6">
                <li>have discussions with suppliers</li>
                <li>apply for planning permission or an abstraction licence (these can take a long time)</li>
              </ul>
              <p class="govuk-body">Read the <a href="https://www.gov.uk/government/publications/water-management-grant-round-3" class="govuk-link" target="_blank">Water Management grant round 3 guidance (opens in a new tab)</a>.</p>
            </div>
          </details>
  # 1.3.1 EXIT work-started-yet: when 'Yes, we have begun project work' is selected
  - title: You cannot apply for a grant from this scheme
    id: aecbebef-7b1b-4d94-b355-3ad52d776876
    path: /exit-work-started-yet-begunwork
    section: 8e00ff98-4e79-4b9d-9913-3694af7f40ca
