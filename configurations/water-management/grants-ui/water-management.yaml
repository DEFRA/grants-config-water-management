        id: 97766702-cab5-4c5a-87ca-182b7f49ec15
        type: Html
        content: >
          <p class="govuk-body">If the members of your water management company are tenants or a landowner and landlord, you must have all the following agreements in place:</p>
          <p class="govuk-body">Tenants must:</p>
          <ul class="govuk-list govuk-list--bullet">
            <li>have a tenancy agreement in place</li>
            <li>make sure the tenancy agreement meets the grant requirements</li>
            <li>consult with your landlord before you apply</li>
            <li>check that the project will not breach the terms of your tenancy agreement</li>
          </ul>
          <p class="govuk-body">Landlords must:</p>
          <ul class="govuk-list govuk-list--bullet">
            <li>consult your tenants before you apply for the grant</li>
            <li>keep your tenants informed about the project and any grant conditions that might have an impact on them</li>
            <li>if successful, allow the RPA to access the project location for monitoring visits for the duration of the grant agreement</li>
          </ul>
          <p class="govuk-body">Read the <a href="https://www.gov.uk/government/publications/water-management-grant-round-3" class="govuk-link" target="_blank">Water Management grant round 3 guidance (opens in a new tab)</a>.</p>
