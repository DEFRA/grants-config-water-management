engine: V2
name: Apply for a Water Management grant
metadata:
  id: 9bc54ba7-b658-4aa7-91ec-cb76ff2648df
  surveyLabel: Water Management Grant
  description: Apply for a Water Management grant
  referenceNumberPrefix: WMG
  submission:
    grantCode: water-management
  grantRedirectRules:
    preSubmission:
      - toPath: '/tasks'
    postSubmission:
      # Default fallback
      - fromGrantsStatus: default
        gasStatus: default
        toGrantsStatus: SUBMITTED
        toPath: /confirmation
    excludedPaths: ['print-submitted-application']
  permissions:
    enforce: true
    resource: csApplications # grant-wide default (application journey)
    pageAccess:
      default: amend
      rules:
        # --- application journey (csApplications) ---
        - paths:
            - declaration
          permission: submit
        - paths:
            - print-submitted-application
            - confirmation
          permission: view
    cannotSubmit:
      csAgreements:
        pageTitle: You cannot submit this claim
        content: |
          <p class="govuk-body">You do not have permission to submit the claim.</p>
          <p class="govuk-body">Contact an authorised person from your business to review and submit the claim.</p>
  supportEmail: ruralpayments@defra.gov.uk
  detailsPage:
    confirmationFieldName: businessDetailsUpToDate
    toleratedFailurePaths:
      - vat
      - countyParishHoldings
    query:
      name: Business
      entities:
        - name: customer
          variableName: crn
          variableSource: credentials.crn
          fields:
            - path: info
              fields:
                - path: name
                  fields:
                    - path: first
                    - path: middle
                    - path: last
                - path: email
                  fields:
                    - path: address
                - path: phone
                  fields:
                    - path: mobile
                    - path: landline
                - path: address
                  fields:
                    - path: line1
                    - path: line2
                    - path: line3
                    - path: line4
                    - path: line5
                    - path: street
                    - path: city
                    - path: postalCode
                    - path: uprn
                    - path: county
                    - path: buildingName
                    - path: buildingNumberRange
                    - path: dependentLocality
                    - path: doubleDependentLocality
                    - path: flatName
                    - path: pafOrganisationName
        - name: business
          variableName: sbi
          variableSource: credentials.sbi
          fields:
            - path: info
              fields:
                - path: reference
                - path: email
                  fields:
                    - path: address
                - path: phone
                  fields:
                    - path: mobile
                    - path: landline
                - path: name
                - path: address
                  fields:
                    - path: line1
                    - path: line2
                    - path: line3
                    - path: line4
                    - path: line5
                    - path: street
                    - path: city
                    - path: postalCode
                    - path: uprn
                    - path: county
                    - path: buildingName
                    - path: buildingNumberRange
                    - path: dependentLocality
                    - path: doubleDependentLocality
                    - path: flatName
                    - path: pafOrganisationName
                - path: vat
    responseMapping:
      business: data.business.info
      customer: data.customer.info
    displaySections:
      - title: Business contact details
        fields:
          - label: Business name
            sourcePath: business.name
          - label: Business address
            sourcePath: business.address
            format: address
          - label: Business phone numbers
            sourcePath: business.phone
            format: phoneNumbers
          - label: Business email address
            sourcePath: business.email.address
      - title: Reference numbers
        fields:
          - label: Single Business Identifier (SBI)
            sourceType: credentials
            sourcePath: sbi
          - label: VAT registration number
            sourcePath: business.vat
      - title: Personal details
        fields:
          - label: Full name
            sourcePath: customer.name
            format: fullName
          - label: Customer reference number
            sourceType: credentials
            sourcePath: crn
          - label: Personal address
            sourcePath: customer.address
            format: address
          - label: Personal phone numbers
            sourcePath: customer.phone
            format: phoneNumbers
          - label: Personal email address
            sourcePath: customer.email.address
  tasklist:
    completeInOrder: true
    returnAfterSection: true
    showCompletionStatus: false
    showQuestions: false
    statuses:
      notStarted:
        text: 'Not started'
        classes: 'govuk-tag--yellow'
      cannotStart:
        text: 'Cannot start yet'
        classes: 'govuk-tag--grey'
      inProgress:
        text: 'In progress'
        classes: 'govuk-tag--blue'
      cannotContinue:
        text: 'On hold'
        classes: 'govuk-tag--purple'
      completed:
        text: 'Completed'
        classes: 'govuk-tag--green'
  printPage:
    showApplicantDetails: true
  incorrectDetailsContent:
    heading: Update your details
    paragraphs:
      - Make sure your details are correct before you apply for a Water Management grant.
      - textBefore: 'To update your details follow our '
        link:
          text: Register and update your details with the Rural Payments Agency guidance
          href: https://www.gov.uk/guidance/update-personal-and-business-details-in-the-rural-payments-service#what-personal-details-you-can-update
        textAfter: '.'
    showRpaSupport: false
  options:
    submitButtonText: Continue

sections:
  - name: check-before-you-start
    title: Check before you start
    id: 8e00ff98-4e79-4b9d-9913-3694af7f40ca
  - name: project-details
    title: Project details
    id: 922947cc-6c6a-4fe5-b831-da27251663a9
  - name: costs-and-timescales
    title: Costs and Timescales
    id: a858ec85-1506-427d-a095-6ac93d959af6
  - name: check-your-answers
    title: Check your answers
    id: 732a6b24-f219-4016-b322-5694a7add213
  - name: submit-your-application
    title: Submit your application
    id: b7006592-79e9-442b-a371-36fa95042c68

pages:
  # ==========================================
  # Pre-task-list pages (no section)
  # ==========================================
  # Check details page
  - title: Confirm your details
    path: /check-details
    controller: CheckDetailsController
    id: 3c451f3b-1164-4d25-8296-782284a4681a
  # Task list page
  - title: Apply for a Water Management grant
    path: /tasks
    controller: TaskListPageController
    id: 5273c5ef-9202-4068-a644-1232a4b86bad

  # ==========================================
  # Section 1: Check before you start
  # ==========================================
  # 1. Crops growing
  - title: What crops are you growing?
    id: 800a5b0f-bd41-4b0b-9453-75eca51f43f3
    path: /crops-growing
    section: 8e00ff98-4e79-4b9d-9913-3694af7f40ca
    controller: TaskPageController
    components:
      - name: cropsGrowing
        id: 32b05b01-5940-40d0-b191-36b5028c01e5
        title: What crops are you growing?
        type: RadiosField
        list: 1f2856d7-0706-4ea2-b382-07697ca7914c
        options:
          required: true
          classes: govuk-radios
        shortDescription: Crops growing
  # 1.1. EXIT crops-growing: when 'Something else' is selected
  - title: You cannot apply for a grant from this scheme
    id: eb9b88ce-1c08-4461-9698-1cbbc794c159
    path: /exit-crops-growing-somethingelse
    section: 8e00ff98-4e79-4b9d-9913-3694af7f40ca
    controller: TerminalPageController
    condition: 12e0a793-1929-4931-ad20-e5eb76d1d95c
    components:
      - name: cropsGrowingSomethingElseInfo
        id: 6503008c-d3e0-4236-b0a6-09d409c2a818
        type: Html
        content: >
          <p class="govuk-body">This grant is only available to:</p>
          <ul class="govuk-list govuk-list--bullet">
            <li>arable and horticultural farming businesses that supply the food industry</li>
            <li>nurseries growing ornamentals</li>
            <li>forestry nurseries</li>
          </ul>
  # 2. Reservoir location
  - title: Confirm where the reservoir will be located
    id: 1b1a1add-7f33-4cf2-9b0e-6ed5cd08ed08
    path: /reservoir-location
    section: 8e00ff98-4e79-4b9d-9913-3694af7f40ca
    controller: TaskPageController
    components:
      - name: businessAddress
        id: 481d56be-e9fc-4b2a-89d2-06c5bf93e633
        title: Business address
        type: UkAddressField
        options:
          required: true
        shortDescription: Business address
      - name: reservoirPostcode
        id: 9ccd42b8-54e0-4855-8d78-00f87a0d755f
        title: Reservoir postcode
        hint: The postcode of the site where the reservoir will be located.
        type: TextField
        options:
          required: true
          classes: govuk-input--width-10
        schema:
          regex: ^[A-Z]{1,2}[0-9][0-9A-Z]?\s?[0-9][A-Z]{2}$
        shortDescription: Reservoir postcode
  # 3. Work started yet
  - title: Have you already started work on the project?
    id: c995d1bb-1c7f-44d5-9a0a-576caa6f66e7
    path: /work-started-yet
    section: 8e00ff98-4e79-4b9d-9913-3694af7f40ca
    controller: TaskPageController
    components:
      - name: workStartedYet
        id: 6d91fee3-d23c-4e05-aa1e-89f23b5f0a1f
        title: Have you already started work on the project?
        type: RadiosField
        list: b1eb45b7-ce4e-4ecf-8d2e-3fe4945348da
        options:
          required: true
          classes: govuk-radios
        shortDescription: Work started yet
      - name: eligibilityContent
        id: 4cd0820a-3f0a-4fbd-87aa-6830dcf25963
        type: Html
        content: |
          <details class="govuk-details" data-module="govuk-details">
            <summary class="govuk-details__summary">
              <span class="govuk-details__summary-text">
                Eligibility
              </span>
            </summary>
            <div class="govuk-details__text">
              <p class="govuk-body">You will invalidate your application if start the project or commit to any costs (such as placing any orders) before you receive a funding agreement.</p>
              <p class="govuk-body">Before you start the project, you can:</p>
              <ul class="govuk-list govuk-list--bullet govuk-!-margin-bottom-6">
                <li>get quotes from suppliers</li>
                <li>apply for planning permission or an abstraction licence (these can take a long time)</li>
              </ul>
            </div>
          </details>
  # 3.1. EXIT work-started-yet: when 'Yes, we have begun project work' is selected
  - title: You cannot apply for a grant from this scheme
    id: aecbebef-7b1b-4d94-b355-3ad52d776876
    path: /exit-work-started-yet-begunwork
    section: 8e00ff98-4e79-4b9d-9913-3694af7f40ca
    controller: TerminalPageController
    condition: b97db953-3321-4262-bf2f-f72945f26e85
    components:
      - name: workStartedYetBegunWorkInfo
        id: 226da8d4-0485-4ee3-8df6-0434c11bec3a
        type: Html
        content: >
          <p class="govuk-body">You cannot apply for a grant if you have already started work on your project.</p>
          <div class="govuk-inset-text">
            <p class="govuk-body">Starting the project or committing to any costs (such as placing orders) before you receive a funding agreement invalidates your application.</p>
          </div>
  # 4. Score results
  - title: Score results (should be hidden)
    id: fd417ccc-c671-49f3-8b79-4ab32aabb71c
    path: /score-results
    section: 8e00ff98-4e79-4b9d-9913-3694af7f40ca
    controller: TaskPageController
    components:
      - name: scoreResults
        id: b9628a02-e028-4892-b262-e21b33bd3461
        title: Score results (should be hidden)
        type: TextField
        options:
          required: true
        shortDescription: Score results (should be hidden)
      - name: scoreResultsContent
        id: 91b42eac-cc5a-48ff-a050-9af715c2e0ed
        type: Html
        content: |
          <p class="govuk-body">Based on your answers, your project score is:</p>
          <div class="govuk-inset-text">
            <p class="govuk-body govuk-!-font-size-24 govuk-!-font-weight-bold">Average</p>
            <p class="govuk-body">This means your project might be successful.</p>
          </div>
          <div class="govuk-summary-card__title-wrapper govuk-!-margin-bottom-6">
            <dl class="govuk-summary-list">
              <div class="govuk-summary-list__row">
                <dt class="govuk-summary-list__key">
                  Strong
                </dt>
                <dd class="govuk-summary-list__value">
                  Based on your answers, a grant application is likely to be successful.
                </dd>
              </div>
              <div class="govuk-summary-list__row">
                <dt class="govuk-summary-list__key">
                  Average
                </dt>
                <dd class="govuk-summary-list__value">
                  Based on your answers, a grant application might be successful.
                </dd>
              </div>
              <div class="govuk-summary-list__row">
                <dt class="govuk-summary-list__key">
                  Weak
                </dt>
                <dd class="govuk-summary-list__value">
                  Based on your answers, a grant application is unlikely to be successful.
                </dd>
              </div>
            </dl>
          </div>
          <div class="govuk-warning-text">
            <span class="govuk-warning-text__icon" aria-hidden="true">i</span>
            <strong class="govuk-warning-text__text">
              <span class="govuk-visually-hidden">Warning</span>
              The likelihood of a full application being successful will also depend on the number and value of applications we receive.
            </strong>
          </div>

  # ==========================================
  # Section 2: Project details
  # ==========================================
  # 1. How much water
  - title: How much water will your reservoir hold when full, in meters cubed (m3)?
    id: a5fd52b7-0dc1-4bce-bc5f-a7598f62cd91
    path: /how-much-water
    section: 922947cc-6c6a-4fe5-b831-da27251663a9
    controller: TaskPageController
    components:
      - name: howMuchWater
        id: 26208f72-951c-4944-869c-2bdd60401433
        title: How much water will your reservoir hold when full, in meters cubed (m3)?
        hint: Enter a whole number.
        type: NumberField
        options:
          required: true
          classes: govuk-!-width-one-third
          suffix: m3
          autocomplete: off
          customValidationMessages:
            any.required: Enter value in meters cubed (m3)
            number.max: Enter a value less than one million meters cubed (m3)
            number.min: Enter a value of one meter cubed (m3) or more
        schema:
          min: 1
          max: 999999
          precision: 0
        shortDescription: How much water (m3)
  # 2. Where water will come from
  - title: Where will the water to fill your reservoir come from?
    id: 73de8e2c-4ada-4418-9278-81360a547381
    path: /where-water-will-come-from
    section: 922947cc-6c6a-4fe5-b831-da27251663a9
    controller: TaskPageController
    components:
      - name: whereWaterWillComeFrom
        id: e40f6766-225f-4dc9-b2ed-d0cf4c858434
        title: Where will the water to fill your reservoir come from?
        hint: Select all that apply
        type: CheckboxesField
        list: 7b0f42ae-8711-4da7-bcc8-bebeb151dbe5
        options:
          required: true
          classes: govuk-radios
        shortDescription: Where water will come from
  # 3. Have planning permission
  - title: Do you already have planning permission for your project?
    id: abfbde5b-c983-47f1-9b24-4586d0568171
    path: /have-planning-permission
    section: 922947cc-6c6a-4fe5-b831-da27251663a9
    controller: TaskPageController
    components:
      - name: havePlanningPermission
        id: 85957609-1ab7-4921-ad8f-5707b455784b
        title: Do you already have planning permission for your project?
        hint: If you are invited to proceed, you will need to provide evidence of planning permission before being offered a grant funding agreement.
        type: YesNoField
        options:
          required: true
          classes: govuk-radios
        shortDescription: Have planning permission
  # 4. Need abstraction licence
  - title: Does the project need an abstraction licence or a variation of one?
    id: 9e72aef7-9efe-499b-a9d8-d3a69dbdc0bf
    path: /need-abstraction-licence
    section: 922947cc-6c6a-4fe5-b831-da27251663a9
    controller: TaskPageController
    components:
      - name: needAbstractionLicence
        id: 86e5ae73-ed7b-4720-8f71-5b461adbe382
        title: Does the project need an abstraction licence or a variation of one?
        hint: If you are invited to proceed, you will need to provide evidence of the appropriate licence before being offered a grant funding agreement.
        type: RadiosField
        list: 9ea41f27-6ef5-4c71-86f7-ad6ddc54557d
        options:
          required: true
          classes: govuk-radios
        shortDescription: Need abstraction licence
  # 5. Supplying other farms
  - title: How many other farms will the project supply water to?
    id: 263d9805-288e-4149-b22f-6b403763be1c
    path: /supplying-other-farms
    section: 922947cc-6c6a-4fe5-b831-da27251663a9
    controller: TaskPageController
    components:
      - name: supplyingOtherFarms
        id: 6e30957f-74f3-4717-aeea-284898e25b1b
        title: How many other farms will the project supply water to?
        hint: If you are invited to proceed, you will need to provide letters of support from any farms other than your own that will be provided with water before being offered a grant funding agreement.
        type: SelectField
        list: 6b2f167b-5564-4671-b987-053828151926
        options:
          required: true
        shortDescription: Supplying other farms
  # 6. Expected project start date
  - title: When do you expect the project work to start?
    id: 7cb1a024-1ce6-45ac-b9ca-009f4848b5e5
    path: /expected-project-start-date
    section: 922947cc-6c6a-4fe5-b831-da27251663a9
    controller: TaskPageController
    components:
      - name: expectedProjectStartDate
        id: 331371cf-61c9-4753-b8c6-a0238ae1375b
        title: When do you expect the project work to start?
        hint: >
          This is when you expect to start digging, signing contracts or placing orders.
          For example, 27 3 2027
        type: DatePartsField
        options:
          required: true
          autocomplete: off
        shortDescription: Expected project start date

  # ==========================================
  # Section 3: Costs and Timescales
  # ==========================================
  # 1. Work items needed
  - title: What eligibility items and work does your project need?
    id: 14ac713a-2c63-4ad4-93d7-f0b4360808b7
    path: /work-items-needed
    section: a858ec85-1506-427d-a095-6ac93d959af6
    controller: TaskPageController
    components:
      - name: workItemsNeeded
        id: 7af61365-6933-40c1-bdd2-8dce5960a8eb
        title: Select all that apply
        hint: The reference amounts shown next to each item or work are the maximum amounts RPA will fund.
        type: CheckboxesField
        list: 8c0a3d2c-9572-4512-9226-7800ff471010
        options:
          required: true
          classes: govuk-radios
        shortDescription: Work items needed
  # 2. Total estimated cost
  - title: What is the total estimated cost of the items?
    id: 47323da6-9abe-4e6d-aab4-c7d04deb2d41
    path: /total-estimated-cost
    section: a858ec85-1506-427d-a095-6ac93d959af6
    controller: TaskPageController
    components:
      - name: totalEstimatedCost
        id: eedadad3-84e1-46a9-be88-7a7a11e5228d
        title: What is the total estimated cost of the items?
        hint: >
          You can only apply for a grant of up to 40% of the estimated costs. The minimum grant you can apply for this project is £35,000 (40% of £87,500). The maximum grant is £500,000.
          Do not include VAT.
          Enter amount, for example £90,000
        type: NumberField
        options:
          required: true
          prefix: £
          autocomplete: off
          classes: govuk-!-width-one-third
          customValidationMessages:
            any.required: Enter value to the nearest pound
            number.max: Enter a value less than or equal to £1,250,000
            number.min: Enter a value of £87,500 or more
        schema:
          min: 87500
          max: 1250000
          precision: 0
        shortDescription: Total estimated cost (£)
  # 3. Potential grant funding
  - title: Potential grant funding
    id: 493756e7-b083-4bed-9727-205208366b1a
    path: /potential-grant-funding
    section: a858ec85-1506-427d-a095-6ac93d959af6
    controller: TaskPageController
    components:
      - name: fortyPercentEstimatedCost
        id: 04527ad5-7e75-4bc2-8965-e3848b1329e1
        title: fortyPercentEstimatedCost (should be hidden)
        type: TextField
        options:
          required: true
        shortDescription: fortyPercentEstimatedCost (should be hidden)
      - name: sixtyPercentEstimatedCost
        id: 8806ae73-ad04-4a65-a628-654249726868
        title: sixtyPercentEstimatedCost (should be hidden)
        type: TextField
        options:
          required: true
        shortDescription: sixtyPercentEstimatedCost (should be hidden)
      - name: potentialGrantFundingInfo
        id: 68342054-a3cc-44b3-860e-61aab15c2798
        type: Html
        content: >
          <p class="govuk-body">You may be able to apply for a grant of up to {{ fortyPercentEstimatedCost | formatCurrency }}, based on the estimated cost of {{ totalEstimatedCost | formatCurrency }}.</p>
          <div class="govuk-warning-text">
            <span class="govuk-warning-text__icon" aria-hidden="true">!</span>
            <strong class="govuk-warning-text__text">
              <span class="govuk-visually-hidden">Warning</span>
              There's no guarantee the project will receive a grant.
            </strong>
          </div>
      - name: canYouPayTheRemainingCosts
        id: 3cbba3b6-7542-4602-88f8-2d73e5e278db
        title: Can you pay the remaining costs of {{ sixtyPercentEstimatedCost | formatCurrency }}?
        type: YesNoField
        options:
          required: true
          classes: govuk-radios
        shortDescription: Can you pay the remaining costs

  # ==========================================
  # Section 4: Check your answers
  # ==========================================
  # 1. Check your answers
  - title: Check your answers
    id: d489e351-3873-4f06-9f7c-88984f56088c
    path: /summary
    section: 732a6b24-f219-4016-b322-5694a7add213
    controller: CheckResponsesPageController
    config:
      width: full

  # ==========================================
  # Section 5: Submit your application
  # ==========================================
  # 1. Submit application
  - title: Submit your application
    id: fdef0855-c5ec-4b85-b289-ef9bccb94bfb
    path: /declaration
    section: b7006592-79e9-442b-a371-36fa95042c68
    controller: DeclarationPageController
    config:
      submitButtonText: Confirm and submit
      showSupportDetails: false
      hiddenFields:
        guidanceRead: 'true'
        applicationConfirmation: 'true'
    components:
      - name: declarationContent
        id: fbcc6123-3d73-4363-8298-042b27389423
        type: Html
        content: |
          <p class="govuk-body">By submitting your application, you confirm that:</p>
          <ul class="govuk-list govuk-list--bullet">
            <li>the information you have provided is correct to the best of your knowledge</li>
            <li>you have read and understand the information in the <a href="https://www.gov.uk/government/publications/pa3-water-management-plan-2026" class="govuk-link" target="_blank">Water Management guidance (opens in new tab)</a> about this application</li>
            <li>you are capable of fulfilling the obligations which will be required of you if your application is successful</li>
            <li>you agree to let any authorised person access the land and relevant records related to this application so they can inspect or audit them to verify the information you’ve provided to the Rural Payments Agency (RPA) and to check that you are complying with this agreement</li>
            <li>you agree to disclose all information relevant to this application, provide any additional information as may be required by the RPA, field officers or auditors and co-operate with or take part in any economic, environmental or other monitoring and evaluation of the scheme (including any research and development studies) conducted by RPA or by anyone appointed by them for that purpose</li>
          </ul>
  # 2. Confirmation
  - title: Confirmation
    id: ae9f2211-7278-4071-bb66-a7f56f4194df
    path: /confirmation
    controller: ConfirmationPageController
    config:
      panelTitle: 'Application submitted'
      panelText: 'Your application number'
    components:
      - name: confirmationContent
        id: f09c9010-6c65-42c3-9afc-b7d6339d955d
        type: Html
        content: |
          <h2 class="govuk-heading-m">What happens next</h2>
          <p class="govuk-body">Thank you for submitting an application for a Water Management grant.</p>
          <p class="govuk-body">If your application meets RPA funding priorities you may be asked to provide the following evidence before being offered a grant funding agreement:</p>
          <ul class="govuk-list govuk-list--bullet govuk-!-margin-bottom-6">
            <li>Evidence of planning permission</li>
            <li>A plan showing existing and proposed irrigation systems</li>
            <li>Evidence of a water-abstraction licence, if necessary for the project</li>
            <li>Letters of support from any other farms the project will supply water to</li>
            <li>A letter from your accountant confirming you can pay the remaining costs of the project</li>
          </ul>

          <p class="govuk-body"><a class="govuk-link" href="/{{SLUG}}/print-submitted-application" target="_blank">View / Print submitted application (opens in new tab)</a></p>
  # 3. Print application
  - title: PrintSubmittedApplication
    id: 3a5aafef-e492-4db2-9111-42c2e3922aba
    path: /print-submitted-application
    controller: PrintSubmittedApplicationController

