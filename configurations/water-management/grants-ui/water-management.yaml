          <p class="govuk-body">This grant is only available to:</p>
          <ul class="govuk-list govuk-list--bullet">
            <li>arable and horticultural farming businesses that supply the food industry</li>
            <li>nurseries growing ornamentals</li>
            <li>forestry nurseries</li>
          </ul>
  # 1.2 Where project located
