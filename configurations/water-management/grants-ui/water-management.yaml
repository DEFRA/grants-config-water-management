  # 2.3 Total estimated grant TODO how to display reservoir
  - title: Total estimated grant
    id: 47323da6-9abe-4e6d-aab4-c7d04deb2d41
    path: /total-estimated-cost
    section: 922947cc-6c6a-4fe5-b831-da27251663a9
    controller: TotalEstimatedCostTaskPageController
    config:
      excludeFromTaskCompletion: true
      derivedState:
        stateKeys:
          - reservoirs
          - reservoirCost
          - distNetworkCostPerUnit
          - waterDistributionNetworkCost
          - tanksCostPerUnit
          - waterTanksCost
          - totalEstimatedCost
          - estimatedMaxGrantBeforeReduction
          - estimatedMaxGrant
          - minGrantReached
          - maxGrantReached
        requiresAcknowledgement: true
      costs:
        reservoirClayHighCostPerUnit: 9
        reservoirClayLowCostPerUnit: 2.25
        reservoirSyntheticHighCostPerUnit: 11
        reservoirSyntheticLowCostPerUnit: 2.75
        distNetworkCostPerUnit: 30
        tanksCostPerUnit: 71
        grantMaxRate: 0.4
    components:
      - name: totalEstimatedCostInfo
        id: 68342054-a3cc-44b3-860e-61aab15c2798
        type: Html
        content: >
          <div class="govuk-inset-text">
            <p class="govuk-body govuk-!-font-size-24 govuk-!-font-weight-bold">{{ context.state.additionalAnswers.estimatedMaxGrant | formatCurrency | replace: '.00', '' }}</p>
            <p class="govuk-body">This is the estimated amount you could apply for at stage 2.</p>
          </div>
          <h2 class="govuk-heading-m">How your total estimated grant was calculated</h2>
          <p class="govuk-body">Grants are based on reference costs to work out the maximum grant amount you could get. Reference costs are based on the expected average cost for each item. The maximum grant available is £300,000.</p>
          <p class="govuk-body">If you’re invited to apply for stage 2, and are successful in being offered a grant funding agreement, the grant you can claim for eligible items will be the lower of 40% of the reference costs or 40% of your actual invoiced costs at claim stage.</p>
          <p class="govuk-body">For more information, read the <a href="https://www.gov.uk/government/publications/pa3-water-management-plan-2026" class="govuk-link" target="_blank">Water Management grant round 3 guidance (opens in a new tab)</a></p>
          <h2 class="govuk-heading-m">Estimated costs</h2>
          <table class="govuk-table">
            <thead class="govuk-table__head">
              <tr class="govuk-table__row">
                <th scope="col" class="govuk-table__header">Item</th>
                <th scope="col" class="govuk-table__header">Details</th>
                <th scope="col" class="govuk-table__header govuk-table__header--numeric">Estimated cost</th>
              </tr>
            </thead>
            <tbody class="govuk-table__body">
              {% if itemsPlanningToInstall contains "RESERVOIR" %}
                {% for reservoir in context.state.additionalAnswers.reservoirs %}
                  <tr class="govuk-table__row">
                    <td class="govuk-table__cell">{{ reservoir.name | default: 'Reservoir' }}</td>
                    <td class="govuk-table__cell">{{ reservoir.type | capitalize }} lined<br/>{{ reservoir.size | formatCurrency | remove: '£' | remove: '.00' }} cubic metres at {{ reservoir.reservoirHighCostPerUnit | formatCurrency | replace: '.00', '' }} per cubic metre for the first 10,000 cubic metres, with any additional volume charged at {{ reservoir.reservoirLowCostPerUnit | formatCurrency | replace: '.00', '' }} per cubic metre</td>
                    <td class="govuk-table__cell govuk-table__cell--numeric">{{ reservoir.cost | formatCurrency | replace: '.00', '' }}</td>
                  </tr>
                {% endfor %}
              {% endif %}
              {% if itemsPlanningToInstall contains "WATER_STORAGE_TANKS" %}
                <tr class="govuk-table__row">
                  <td class="govuk-table__cell">Water storage tank(s)</td>
                  <td class="govuk-table__cell">{{ waterStorageCapacity | formatCurrency | remove: '£' | remove: '.00' }} cubic metres at {{ context.state.additionalAnswers.tanksCostPerUnit | formatCurrency | replace: '.00', '' }} per cubic metre</td>
                  <td class="govuk-table__cell govuk-table__cell--numeric">{{ context.state.additionalAnswers.waterTanksCost | formatCurrency | replace: '.00', '' }}</td>
                </tr>
              {% endif %}
              {% if itemsPlanningToInstall contains "WATER_DISTRIBUTION_NETWORK" %}
                <tr class="govuk-table__row">
                  <td class="govuk-table__cell">Water distribution network</td>
                  <td class="govuk-table__cell">{{ waterDistributionLength | formatCurrency | remove: '£' | remove: '.00' }} metres at {{ context.state.additionalAnswers.distNetworkCostPerUnit | formatCurrency | replace: '.00', '' }} per metre</td>
                  <td class="govuk-table__cell govuk-table__cell--numeric">{{ context.state.additionalAnswers.waterDistributionNetworkCost | formatCurrency | replace: '.00', '' }}</td>
                </tr>
              {% endif %}
              <tr class="govuk-table__row">
                <th scope="row" class="govuk-table__header" colspan="2">Total estimated cost</th>
                <td class="govuk-table__cell govuk-table__cell--numeric govuk-!-font-weight-bold">{{ context.state.additionalAnswers.totalEstimatedCost | formatCurrency | replace: '.00', '' }}</td>
              </tr>
            </tbody>
          </table>
          <h2 class="govuk-heading-m govuk-!-margin-bottom-0">Estimated grant</h2>
          <table class="govuk-table govuk-!-margin-bottom-0">
            <tbody class="govuk-table__body">
              <tr class="govuk-table__row" style="border: none;">
                <td class="govuk-table__cell" style="border: none;">Total estimated grant</td>
                <td class="govuk-table__cell" style="border: none;">40% of {{ context.state.additionalAnswers.totalEstimatedCost | formatCurrency | replace: '.00', '' }}</td>
                <td class="govuk-table__cell govuk-table__cell--numeric govuk-!-font-weight-bold" style="border: none;">{{ context.state.additionalAnswers.estimatedMaxGrant | formatCurrency | replace: '.00', '' }}</td>
              </tr>
            </tbody>
          </table>
          <hr class="govuk-section-break govuk-section-break--visible govuk-!-margin-bottom-6">
      - name: understandNoGuaranteedSuccessOnEstimatedCostPage
        id: 37c68068-38d6-4a39-b64e-44dce1558293
        title: Confirm
        type: DeclarationField
        options:
          required: true
          declarationConfirmationLabel: I understand there is no guarantee that my application will be successful
        shortDescription: No guarantee declaration
  # See EXTRA PAGES for min grant not reached exit page
  # ============================================
  # Section 4: Check and submit your application
  # ============================================
  # 3.1 Check your answers
  - title: Check your answers
    id: d489e351-3873-4f06-9f7c-88984f56088c
    path: /summary
    section: b7006592-79e9-442b-a371-36fa95042c68
    controller: CheckResponsesPageController
    config:
      width: full
      derivedStatePages:
        - /score-results
        - /total-estimated-cost
      additionalSections:
        - page: /score-results
          items:
            - title: Eligibility score
              stateValue: additionalAnswers.totalScore
        - page: /total-estimated-cost
          items:
            - title: Estimated grant (£)
              stateValue: additionalAnswers.estimatedMaxGrant
  # 3.2 Submit application
  - title: Submit your application
    id: fdef0855-c5ec-4b85-b289-ef9bccb94bfb
    path: /declaration
    section: b7006592-79e9-442b-a371-36fa95042c68
    controller: DeclarationPageController
    config:
      submitButtonText: Confirm and submit your application
      showSupportDetails: false
      hiddenFields:
        guidanceRead: 'true'
        applicationConfirmation: 'true'
    components:
      - name: declarationContent
        id: fbcc6123-3d73-4363-8298-042b27389423
        type: Html
        content: >
          <p class="govuk-body">By submitting your application, you confirm that:</p>
          <ul class="govuk-list govuk-list--bullet">
            <li>the information you have provided is correct to the best of your knowledge</li>
            <li>you have read and understood the information in the <a href="https://www.gov.uk/government/publications/pa3-water-management-plan-2026" class="govuk-link" target="_blank">Water Management grant round 3 guidance (opens in a new tab)</a></li>
            <li>you have read, understood and agree to the <a href="https://www.gov.uk/government/publications/pa3-water-management-plan-2026" class="govuk-link" target="_blank">Water Management grant round 3 general terms and conditions (opens in a new tab)</a> under which this grant is offered</li>
            <li>you understand that if you are offered the grant, the grant funding agreement may contain specific conditions which will apply for the duration of the agreement</li>
            <li>you’re not aware of any circumstances which would prevent you from fulfilling the obligations which will be required of you if your application is successful</li>
          </ul>
      - name: acceptTermsAndConditionsOnSubmitApplicationPage
        id: 1eb2dc48-1f2d-4a70-8957-41a71ce41a22
        title: Confirm
        type: DeclarationField
        options:
          required: true
          declarationConfirmationLabel: I accept the terms and conditions
        shortDescription: Acceptance of terms and conditions
  # 3.3 Confirmation
  - title: Confirmation
    id: ae9f2211-7278-4071-bb66-a7f56f4194df
    path: /confirmation
    controller: ConfirmationPageController
    config:
      panelTitle: 'Application submitted'
      panelText: 'Your application number'
    components:
      - name: confirmationContent
        id: f09c9010-6c65-42c3-9afc-b7d6339d955d
        type: Html
        content: >
          <h2 class="govuk-heading-m">What happens next</h2>
          <p class="govuk-body">Your stage 1 application for a Water Management grant round 3 (WMG R3) has been submitted.</p>
          <p class="govuk-body">We’ll now assess your application against our eligibility criteria and RPA funding priorities. If your stage 1 application is successful, we’ll invite you to  stage 2 of the application process where you’ll need to show:</p>
          <ul class="govuk-list govuk-list--bullet govuk-!-margin-bottom-6">
            <li>project plans, maps and drawings</li>
            <li>letters or emails of support from all the businesses that will use the water to irrigate their crops</li>
            <li>a letter from your accountant confirming that your business is viable and can pay the remaining project costs</li>
          </ul>
          <p class="govuk-body">We’ll tell you the full list of supporting documents we require if you’re invited to stage 2. Read the <a href="https://www.gov.uk/government/publications/water-management-grant-round-3" class="govuk-link" target="_blank">Water Management grant round 3 guidance (opens in a new tab)</a> for more information.</p>
          <p class="govuk-body">The window for stage 1 applications closes at 11.59pm on 23 February 2027. The RPA will invite successful applicants to apply for stage 2 soon after that.</p>
          <p class="govuk-body"><a class="govuk-link" href="/{{SLUG}}/print-submitted-application" target="_blank">View / Print submitted application (opens in new tab)</a></p>
  # 3.4 Print application
  - title: PrintSubmittedApplication
    id: 3a5aafef-e492-4db2-9111-42c2e3922aba
    path: /print-submitted-application
    controller: PrintSubmittedApplicationController
    config:
      width: full
  # ==========================================
  # Landing page for return to customer
  # ==========================================

  # =======================================================
  # EXTRA PAGES, only accessible via custom exit conditions
  # =======================================================
  # 1.2.1 EXIT where-project-located when location is not in England
  - title: Your project must be in England
    id: 7cca24be-610e-4c56-8684-928be4cb95c9
    path: /exit-where-project-located # don't change this without changing grants-ui LocationValidateController.getNextPath
    section: 8e00ff98-4e79-4b9d-9913-3694af7f40ca
    controller: TerminalPageController
    components:
      - name: whereProjectLocatedNotInEnglandInfo
        id: 34f0a49a-29cc-43df-8093-8894b81b13ef
        type: Html # TODO update link - return to map
        content: >
          <p class="govuk-body">You cannot apply for this grant because you have selected a location that is not in England.</p>
          <p class="govuk-body">If your project is in England, <a href="/water-management/where-project-located" class="govuk-link">return to the map page</a> and select the correct location.</p>
          <p class="govuk-body"><a href="https://www.gov.uk/government" class="govuk-link" target="_blank">Check what other grants you may be eligible for (opens in a new tab)</a></p>
  # 2.3.1 EXIT total-estimated-cost: when minGrantReached=false
  - title: Your eligible projects costs are too low to qualify for a grant
    id: a57dd815-7b9f-4434-bf27-2d7145e3a4f6
    path: /exit-total-estimated-cost # don't change this without changing grants-ui TotalEstimatedCostController.getNextPath
    section: 922947cc-6c6a-4fe5-b831-da27251663a9
    controller: TerminalPageController
    components:
      - name: totalEstimatedCostMinNotReachedInfo
        id: 0ea6b5ac-be67-4e14-89dc-cfa26bf37e11
        type: Html
        content: >
          {% if itemsPlanningToInstall.size == 1 and itemsPlanningToInstall contains "WATER_STORAGE_TANKS" %}
          <p class="govuk-body">Your eligible project costs must be at least £35,500 to qualify for a grant.</p>
            <p class="govuk-body">This is because the grant covers 40% of your eligible project costs and the minimum grant you can receive is £15,000.</p>
          {% else %}
            <p class="govuk-body">Your eligible project costs must be at least £87,500 to qualify for a grant.</p>
            <p class="govuk-body">This is because the grant covers 40% of your eligible project costs and the minimum grant you can receive is £35,000.</p>
          {% endif %}
          <p class="govuk-body"><a href="https://www.gov.uk/government" class="govuk-link" target="_blank">Check what other grants you may be eligible for (opens in a new tab)</a></p>

