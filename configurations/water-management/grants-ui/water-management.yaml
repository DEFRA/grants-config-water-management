    controller: TaskPageController
    components:
      - name: howMuchWater
        id: 26208f72-951c-4944-869c-2bdd60401433
        title: How much water will your reservoir hold when full, in metres cubed (m³)?
        hint: Enter a whole number.
        type: NumberField
        options:
          required: true
          classes: govuk-!-width-one-third
          suffix: m³
          autocomplete: off
          customValidationMessages:
            any.required: Enter value in metres cubed (m³)
            number.max: Enter a value less than one million metres cubed (m³)
            number.min: Enter a value of one metre cubed (m³) or more
        schema:
          min: 1
          max: 999999
          precision: 0
        shortDescription: Reservoir storage capacity (m³)
  # 2.2.2 Water distribution length
  - title: How long will the water distribution network be, in metres (m)?
    id: 5f6de34d-250a-43b1-ba92-a4a388fc36cb
    path: /water-distribution-length
    section: 922947cc-6c6a-4fe5-b831-da27251663a9
    controller: TaskPageController
    condition: d1da14c4-a8da-49c1-b3c2-d9555e5f223f
    components:
      - name: waterDistributionLength
        id: a1ff4fd2-95a9-46f4-b7b8-1d6ad0a6ec21
