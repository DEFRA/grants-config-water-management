          <p class="govuk-body"><a href="https://www.gov.uk/government" class="govuk-link" target="_blank">Check what other grants you may be eligible for (opens in a new tab)</a></p>
  # 1.5 Organisation type
  - title: What type of applicant are you?
    id: f9ca590d-169c-46cc-8819-4be089a30eb9
    path: /organisation-type
    section: 8e00ff98-4e79-4b9d-9913-3694af7f40ca
    controller: TaskPageController
    components:
      - name: organisationType
        id: 7a52568c-6927-432a-8eb4-65ba36f14283
        title: What type of applicant are you?
        type: RadiosField
        list: 67a7167d-3807-425e-a16a-d877e8ad4b1a
        options:
          required: true
        shortDescription: Applicant type
  # 1.5.1 EXIT eligible-organisation: when 'Yes' is selected
  - title: You cannot apply for a grant from this scheme
    id: b6a6a7d6-c083-4313-8db6-0e0d1c3b4c92
    path: /exit-organisation-type
    section: 8e00ff98-4e79-4b9d-9913-3694af7f40ca
    controller: TerminalPageController
    condition: 82cab4cd-3302-46ad-949d-6e3dbe33f68f
    components:
      - name: organisationTypeNoneAboveInfo
        id: c9f27341-4976-4836-b1c2-24e04f19904d
        type: Html
        content: >
          <p class="govuk-body">This grant is only available to landowner landlords, landowner farmers, tenant farmers or growers and water management companies.</p>
          <p class="govuk-body"><a href="https://www.gov.uk/government" class="govuk-link" target="_blank">Check what other grants you may be eligible for (opens in a new tab)</a></p>
  # 1.5.1 ORG TYPE LANDLORD NOT FARMING: What you need to do
  - title: What you need to do as a landowner landlord
    id: e5ba53d6-c017-4323-a45e-af04c6c209e9
    path: /what-landlords-need-to-do
    section: 8e00ff98-4e79-4b9d-9913-3694af7f40ca
    controller: TaskPageController
    condition: 8a7e18eb-3e36-44e9-87c0-5d0757d3b51a
    config:
      excludeFromTaskCompletion: true
    components:
      - name: whatLandlordsNeedToDoInfo
        id: f8c5c883-c9ec-4fb7-8ce8-58859b933484
        type: Html
        content: >
          <p class="govuk-body">You should consult your tenants before you apply for the grant.</p>
          <p class="govuk-body">You must keep your tenants informed about the project and any grant conditions that might have an impact on them.</p>
          <p class="govuk-body">If you’re successful, you and your tenant will need to allow the RPA to access the project location for monitoring visits for the duration of the grant agreement.</p>
          <p class="govuk-body">Read the <a href="https://www.gov.uk/government/publications/water-management-grant-round-3" class="govuk-link" target="_blank">Water Management grant round 3 guidance (opens in a new tab)</a>.</p>
      - name: confirmConsultedWithTenants
        id: bef87169-aa5a-4b75-bfdd-323fbc81f5c4
        title: Confirm
        type: DeclarationField
        options:
          required: true
          declarationConfirmationLabel: I confirm I have consulted (or will consult) tenants about this project
        shortDescription: Landowner landlord responsibilities
  # 1.5.2 ORG TYPE TENANT: What you need to do
  - title: What you need to do as a tenant farmer or grower
    id: 70c01819-e87d-463f-97ca-951434b0fed1
    path: /what-tenants-need-to-do
    section: 8e00ff98-4e79-4b9d-9913-3694af7f40ca
    controller: TaskPageController
    condition: 8e1b9ba9-494e-473b-909e-7055fa25315c
    config:
      excludeFromTaskCompletion: true
    components:
      - name: whatTenantsNeedToDoInfo
        id: 0b163051-ba80-42f6-a5df-ef2a9186ef53
        type: Html
        content: >
          <p class="govuk-body">You must have a current tenancy agreement in place and make sure it meets the grant requirements.</p>
          <p class="govuk-body">You must consult with your landlord before you apply and check that the project will not breach the terms of your tenancy agreement.</p>
