      - name: havePlanningPermission
        id: 85957609-1ab7-4921-ad8f-5707b455784b
        title: Do you already have planning permission for this project confirmed by your Local Planning Authority?
        hint: >
          If you are building a reservoir you will need to apply for and receive the relevant permission from your Local Planning Authority in advance of starting construction of your project.

          This could be through the prior notification or full planning permission process.

          If you are applying for a water storage tank you should consult your Local Planning Authority regarding the type of consent you will need.
