  # 2.3 Total estimated cost TODO how to display reservoir
  - title: Total estimated cost
    id: 47323da6-9abe-4e6d-aab4-c7d04deb2d41
    path: /total-estimated-cost
    section: 922947cc-6c6a-4fe5-b831-da27251663a9
    controller: TotalEstimatedCostTaskPageController
    config:
      excludeFromTaskCompletion: true
      derivedState:
        stateKeys:
          - reservoirHighCostPerUnit
          - reservoirLowCostPerUnit
          - distNetworkCostPerUnit
          - tanksCostPerUnit
          - reservoirCost
          - waterDistributionNetworkCost
          - waterTanksCost
          - totalEstimatedCost
          - estimatedMaxGrantBeforeReduction
          - estimatedMaxGrant
          - minGrantReached
          - maxGrantReached
        requiresAcknowledgement: true
      costs:
        reservoirClayHighCostPerUnit: 9
        reservoirClayLowCostPerUnit: 2.25
        reservoirSyntheticHighCostPerUnit: 11
        reservoirSyntheticLowCostPerUnit: 2.75
        distNetworkCostPerUnit: 30
        tanksCostPerUnit: 71
        grantMaxRate: 0.4
    components:
      - name: totalEstimatedCostInfo
        id: 68342054-a3cc-44b3-860e-61aab15c2798
        type: Html
        content: >
          <p class="govuk-body">You can apply for a grant of up to 40% of the estimated costs of your project.</p>
          <p class="govuk-body">The total estimated costs are as follows:</p>
          <ul class="govuk-list govuk-list--bullet">
            {% if itemsPlanningToInstall contains "CLAY_LINED_RESERVOIR" %}
              <li>Reservoir – clay lined: {{ howMuchWater }} m³ at {{ context.state.additionalAnswers.reservoirHighCostPerUnit | formatCurrency }}/m³ for the first 10,000 m³, with any additional volume charged at {{ context.state.additionalAnswers.reservoirLowCostPerUnit | formatCurrency }}/m³, giving a total of {{ context.state.additionalAnswers.reservoirCost | formatCurrency }}.</li>
            {% endif %}
            {% if itemsPlanningToInstall contains "SYNTHETIC_LINED_RESERVOIR" %}
              <li>Reservoir – synthetic lined: {{ howMuchWater }} m³ at {{ context.state.additionalAnswers.reservoirHighCostPerUnit | formatCurrency }}/m³ for the first 10,000 m³, with any additional volume charged at {{ context.state.additionalAnswers.reservoirLowCostPerUnit | formatCurrency }}/m³, giving a total of {{ context.state.additionalAnswers.reservoirCost | formatCurrency }}.</li>
            {% endif %}
            {% if itemsPlanningToInstall contains "WATER_DISTRIBUTION_NETWORK" %}
              <li>Water distribution network: {{ waterDistributionLength }}m at {{ context.state.additionalAnswers.distNetworkCostPerUnit | formatCurrency }} per m = {{ context.state.additionalAnswers.waterDistributionNetworkCost | formatCurrency }}</li>
            {% endif %}
            {% if itemsPlanningToInstall contains "WATER_STORAGE_TANKS" %}
              <li>Water storage tank(s): {{ waterStorageCapacity }}m³ at {{ context.state.additionalAnswers.tanksCostPerUnit | formatCurrency }} per m³ = {{ context.state.additionalAnswers.waterTanksCost | formatCurrency }}</li>
            {% endif %}
          </ul>
          <hr class="govuk-section-break govuk-section-break--m govuk-section-break--visible">
          <p class="govuk-body"><strong>Total estimated cost = {{ context.state.additionalAnswers.totalEstimatedCost | formatCurrency }}</strong></p>
  # See EXTRA PAGES for min grant not reached exit page
  # ============================================
  # Section 3: Check and submit your application
  # ============================================
  # 3.1 Check your answers
  - title: Check your answers
    id: d489e351-3873-4f06-9f7c-88984f56088c
    path: /summary
    section: b7006592-79e9-442b-a371-36fa95042c68
    controller: CheckResponsesPageController
    config:
      width: full
      derivedStatePages:
        - /score-results
        - /total-estimated-cost
      additionalSections:
        - page: /score-results
          items:
            - title: Score
              stateValue: additionalAnswers.totalScore
        - page: /total-estimated-cost
          items:
            - title: Total Estimated Cost (£)
              stateValue: additionalAnswers.totalEstimatedCost
  # 3.2 Potential funding
  - title: Potential grant funding
    id: c78a90a0-91be-4c93-976c-ae18378e4996
    path: /potential-funding
    section: b7006592-79e9-442b-a371-36fa95042c68
    controller: TaskPageController
    components:
      - name: potentialFundingContent
        id: b22ac6e2-59fe-47ce-bdf6-4ddb6bd85bd5
        type: Html
        content: >
          <p class="govuk-body">You may be able to apply for a grant of up to <strong>{{ context.state.additionalAnswers.estimatedMaxGrant | floor | formatCurrency }}</strong>, based on an estimated cost of <strong>{{ context.state.additionalAnswers.totalEstimatedCost | formatCurrency }}</strong>.</p>
          <p class="govuk-body">You will need to be able to fund the remainder of your project costs.</p>
          <div class="govuk-warning-text">
            <span class="govuk-warning-text__icon" aria-hidden="true">!</span>
            <strong class="govuk-warning-text__text">
              <span class="govuk-visually-hidden">Warning</span>
              There's no guarantee the project will receive a grant
            </strong>
          </div>
          <hr class="govuk-section-break govuk-section-break--m govuk-section-break--visible">
          <p class="govuk-body">Based on your answers, your project score is</p>
          <strong class="govuk-tag govuk-tag--yellow govuk-!-margin-bottom-4 govuk-!-font-weight-bold">{{ context.state.additionalAnswers.totalScore }} out of 100</strong>
  # 3.3 Submit application
  - title: Submit your application
    id: fdef0855-c5ec-4b85-b289-ef9bccb94bfb
    path: /declaration
    section: b7006592-79e9-442b-a371-36fa95042c68
    controller: DeclarationPageController
    config:
      submitButtonText: Confirm and submit
      showSupportDetails: false
      hiddenFields:
        guidanceRead: 'true'
        applicationConfirmation: 'true'
    components:
      - name: declarationContent
        id: fbcc6123-3d73-4363-8298-042b27389423
        type: Html
        content: >
          <p class="govuk-body">By submitting your application, you confirm that:</p>
          <ul class="govuk-list govuk-list--bullet">
            <li>the information you have provided is correct to the best of your knowledge</li>
            <li>you have read and understand the information in the <a href="https://www.gov.uk/government/publications/pa3-water-management-plan-2026" class="govuk-link" target="_blank">Water Management guidance (opens in new tab)</a> about this application</li>
            <li>you are capable of fulfilling the obligations which will be required of you if your application is successful</li>
            <li>you agree to let any authorised person access the land and relevant records related to this application so they can inspect or audit them to verify the information you’ve provided to the Rural Payments Agency (RPA) and to check that you are complying with this agreement</li>
            <li>you agree to disclose all information relevant to this application, provide any additional information as may be required by the RPA, field officers or auditors and co-operate with or take part in any economic, environmental or other monitoring and evaluation of the scheme (including any research and development studies) conducted by RPA or by anyone appointed by them for that purpose</li>
          </ul>
  # 3.4 Confirmation
  - title: Confirmation
    id: ae9f2211-7278-4071-bb66-a7f56f4194df
    path: /confirmation
    controller: ConfirmationPageController
    config:
      panelTitle: 'Application submitted'
      panelText: 'Your application number'
    components:
      - name: confirmationContent
        id: f09c9010-6c65-42c3-9afc-b7d6339d955d
        type: Html
        content: >
          <h2 class="govuk-heading-m">What happens next</h2>
          <p class="govuk-body">Thank you for submitting an application for a Water Management grant.</p>
          <p class="govuk-body">If your application meets RPA funding priorities you may be asked to provide the following evidence before being offered a grant funding agreement:</p>
          <ul class="govuk-list govuk-list--bullet govuk-!-margin-bottom-6">
            <li>Evidence of planning permission</li>
            <li>A plan showing existing and proposed irrigation systems</li>
            <li>Evidence of a water-abstraction licence, if necessary for the project</li>
            <li>Letters of support from any other farms the project will supply water to</li>
            <li>A letter from your accountant confirming you can pay the remaining costs of the project</li>
          </ul>

          <p class="govuk-body"><a class="govuk-link" href="/{{SLUG}}/print-submitted-application" target="_blank">View / Print submitted application (opens in new tab)</a></p>
  # 3.5 Print application
  - title: PrintSubmittedApplication
    id: 3a5aafef-e492-4db2-9111-42c2e3922aba
    path: /print-submitted-application
    controller: PrintSubmittedApplicationController
  # ==========================================
  # Landing page for return to customer
  # ==========================================

  # =======================================================
  # EXTRA PAGES, only accessible via custom exit conditions
  # =======================================================
  # 2.3.1 EXIT total-estimated-cost: when minGrantReached=false
  - title: You cannot apply for a grant from this scheme
    id: a57dd815-7b9f-4434-bf27-2d7145e3a4f6
    path: /exit-total-estimated-cost # don't change this without changing grants-ui TotalEstimatedCostController.getNextPath
    section: 922947cc-6c6a-4fe5-b831-da27251663a9
    controller: TerminalPageController
    components:
      - name: totalEstimatedCostMinNotReachedInfo
        id: 0ea6b5ac-be67-4e14-89dc-cfa26bf37e11
        type: Html
        content: >
          <p class="govuk-body">You cannot apply for a grant if you have already started work on your project.</p>
          <div class="govuk-inset-text">
            <p class="govuk-body">Starting the project or committing to any costs (such as placing orders) before you receive a funding agreement invalidates your application.</p>
          </div>

