  # 2.2.3 Water storage capacity
  - title: What will the total storage capacity of water storage tank(s) be, in metres cubed (m³)?
    id: 275fbb62-a3d8-47ac-9564-96e60fe9db6c
    path: /water-storage-capacity
    section: 922947cc-6c6a-4fe5-b831-da27251663a9
    controller: TaskPageController
    condition: 89a11523-dff8-44c2-82e4-073e4b22f4cc
    components:
      - name: waterStorageCapacity
        id: a19b4ad2-a777-4d5a-ad03-607537709f61
        title: What will the total storage capacity of water storage tank(s) be, in metres cubed (m³)?
        hint: Your total estimated cost will be calculated based on a standard cost of £71 per metres cubed (m³). Enter a whole number (no decimal places).
        type: NumberField
