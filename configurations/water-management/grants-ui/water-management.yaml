  # 2.3 Total estimated grant TODO how to display reservoir
  - title: Total estimated grant
    id: 47323da6-9abe-4e6d-aab4-c7d04deb2d41
    path: /total-estimated-cost
    section: 922947cc-6c6a-4fe5-b831-da27251663a9
    controller: TotalEstimatedCostTaskPageController
    config:
      excludeFromTaskCompletion: true
      submitButtonText: Confirm and continue
      derivedState:
        stateKeys:
          - reservoirHighCostPerUnit
          - reservoirLowCostPerUnit
          - distNetworkCostPerUnit
          - tanksCostPerUnit
          - reservoirCost
          - waterDistributionNetworkCost
          - waterTanksCost
          - totalEstimatedCost
          - estimatedMaxGrantBeforeReduction
          - estimatedMaxGrant
          - minGrantReached
          - maxGrantReached
        requiresAcknowledgement: true
      costs:
        reservoirClayHighCostPerUnit: 10
        reservoirClayLowCostPerUnit: 2
        reservoirSyntheticHighCostPerUnit: 10
        reservoirSyntheticLowCostPerUnit: 2
        distNetworkCostPerUnit: 25
        tanksCostPerUnit: 50
        grantMaxRate: 0.4
    components:
      - name: totalEstimatedCostInfo
        id: 68342054-a3cc-44b3-860e-61aab15c2798
        type: Html
        content: >
          <div class="govuk-inset-text">
            <p class="govuk-body govuk-!-font-size-24 govuk-!-font-weight-bold">{{ context.state.additionalAnswers.estimatedMaxGrant | formatCurrency | replace: '.00', '' }}</p>
            <p class="govuk-body">This is the estimated amount you could apply for at stage 2.</p>
          </div>
          <h2 class="govuk-heading-m">How your total estimated grant was calculated</h2>
          <p class="govuk-body">Your estimated grant is based on 40% of the reference costs for the items in your application.</p>
          <p class="govuk-body">If you’re invited to apply for stage 2, the grant you can claim will be the lower of:</p>
          <ul class="govuk-list govuk-list--bullet">
            <li>40% of the reference costs shown below</li>
            <li>40% of your actual invoiced costs at claim stage</li>
          </ul>
          <h2 class="govuk-heading-m">Estimated costs</h2>
          <table class="govuk-table">
            <thead class="govuk-table__head">
              <tr class="govuk-table__row">
                <th scope="col" class="govuk-table__header">Item</th>
                <th scope="col" class="govuk-table__header">Details</th>
                <th scope="col" class="govuk-table__header govuk-table__header--numeric">Estimated cost</th>
              </tr>
            </thead>
            <tbody class="govuk-table__body">
              {% if itemsPlanningToInstall contains "RESERVOIR" %}
                <tr class="govuk-table__row">
                  <td class="govuk-table__cell">Reservoir – {{ context.state.whatTypeOfReservoir }} lined</td>
                  <td class="govuk-table__cell">{{ howMuchWater | formatCurrency | remove: '£' | remove: '.00' }}m³ at {{ context.state.additionalAnswers.reservoirHighCostPerUnit | formatCurrency | replace: '.00', '' }}/m³ for the first 10,000m³, with any additional volume charged at {{ context.state.additionalAnswers.reservoirLowCostPerUnit | formatCurrency | replace: '.00', '' }}/m³</td>
                  <td class="govuk-table__cell govuk-table__cell--numeric">{{ context.state.additionalAnswers.reservoirCost | formatCurrency | replace: '.00', '' }}</td>
                </tr>
              {% endif %}
              {% if itemsPlanningToInstall contains "SYNTHETIC_LINED_RESERVOIR" %}
                <tr class="govuk-table__row">
                  <td class="govuk-table__cell">Reservoir – synthetic lined</td>
                  <td class="govuk-table__cell">0m³ at {{ context.state.additionalAnswers.reservoirHighCostPerUnit | formatCurrency | replace: '.00', '' }}/m³ for the first 10,000m³, with any additional volume charged at {{ context.state.additionalAnswers.reservoirLowCostPerUnit | formatCurrency | replace: '.00', '' }}/m³</td>
                  <td class="govuk-table__cell govuk-table__cell--numeric">£0</td>
                </tr>
              {% endif %}
              {% if itemsPlanningToInstall contains "WATER_DISTRIBUTION_NETWORK" %}
                <tr class="govuk-table__row">
                  <td class="govuk-table__cell">Water distribution network</td>
                  <td class="govuk-table__cell">{{ waterDistributionLength | formatCurrency | remove: '£' | remove: '.00' }}m at {{ context.state.additionalAnswers.distNetworkCostPerUnit | formatCurrency | replace: '.00', '' }} per m</td>
                  <td class="govuk-table__cell govuk-table__cell--numeric">{{ context.state.additionalAnswers.waterDistributionNetworkCost | formatCurrency | replace: '.00', '' }}</td>
                </tr>
              {% endif %}
              {% if itemsPlanningToInstall contains "WATER_STORAGE_TANKS" %}
                <tr class="govuk-table__row">
                  <td class="govuk-table__cell">Water storage tank(s)</td>
                  <td class="govuk-table__cell">{{ waterStorageCapacity | formatCurrency | remove: '£' | remove: '.00' }}m³ at {{ context.state.additionalAnswers.tanksCostPerUnit | formatCurrency | replace: '.00', '' }} per m³</td>
                  <td class="govuk-table__cell govuk-table__cell--numeric">{{ context.state.additionalAnswers.waterTanksCost | formatCurrency | replace: '.00', '' }}</td>
                </tr>
              {% endif %}
            </tbody>
          </table>
          <h2 class="govuk-heading-m">Estimated grant</h2>
          <table class="govuk-table">
            <tbody class="govuk-table__body">
              <tr class="govuk-table__row" style="border: none;">
                <td class="govuk-table__cell" style="border: none;">Total estimated grant</td>
                <td class="govuk-table__cell" style="border: none;">40% of {{ context.state.additionalAnswers.totalEstimatedCost | formatCurrency | replace: '.00', '' }}</td>
                <td class="govuk-table__cell govuk-table__cell--numeric govuk-!-font-weight-bold" style="border: none;">{{ context.state.additionalAnswers.estimatedMaxGrant | formatCurrency | replace: '.00', '' }}</td>
              </tr>
            </tbody>
          </table>
          <hr class="govuk-section-break govuk-section-break--m govuk-section-break--visible">
      - name: understandNoGuaranteedSuccessOnEstimatedCostPage
        id: 37c68068-38d6-4a39-b64e-44dce1558293
        title: Confirm # TODO discuss with design
        type: CheckboxesField
        list: 7f849dda-527d-49a9-900d-39480430d613
        options:
          required: true
        shortDescription: Understand no guaranteed success on estimated cost page
  # See EXTRA PAGES for min grant not reached exit page
  # ============================================
  # Section 4: Check and submit your application
  # ============================================
  # 3.1 Check your answers
  - title: Check your answers
    id: d489e351-3873-4f06-9f7c-88984f56088c
    path: /summary
    section: b7006592-79e9-442b-a371-36fa95042c68
    controller: CheckResponsesPageController
    config:
      width: full
      derivedStatePages:
        - /score-results
        - /total-estimated-cost
      additionalSections:
        - page: /score-results
          items:
            - title: Score
              stateValue: additionalAnswers.totalScore
        - page: /total-estimated-cost
          items:
            - title: Total estimated grant (£)
              stateValue: additionalAnswers.estimatedMaxGrant
  # 3.2 Submit application
  - title: Submit your application
    id: fdef0855-c5ec-4b85-b289-ef9bccb94bfb
    path: /declaration
    section: b7006592-79e9-442b-a371-36fa95042c68
    controller: DeclarationPageController
    config:
      submitButtonText: Submit your application
      showSupportDetails: false
      hiddenFields:
        guidanceRead: 'true'
        applicationConfirmation: 'true'
    components:
      - name: declarationContent
        id: fbcc6123-3d73-4363-8298-042b27389423
        type: Html
        content: >
          <p class="govuk-body">By submitting your application, you confirm that:</p>
          <ul class="govuk-list govuk-list--bullet">
            <li>the information you have provided is correct to the best of your knowledge</li>
            <li>you have read and understand the information in the <a href="https://www.gov.uk/government/publications/pa3-water-management-plan-2026" class="govuk-link" target="_blank">Water Management guidance (opens in new tab)</a> about this application</li>
            <li>you are capable of fulfilling the obligations which will be required of you if your application is successful</li>
            <li>you agree to let any authorised person access the land and relevant records related to this application so they can inspect or audit them to verify the information you’ve provided to the Rural Payments Agency (RPA) and to check that you are complying with this agreement</li>
            <li>you agree to disclose all information relevant to this application, provide any additional information as may be required by the RPA, field officers or auditors and co-operate with or take part in any economic, environmental or other monitoring and evaluation of the scheme (including any research and development studies) conducted by RPA or by anyone appointed by them for that purpose</li>
          </ul>
      - name: acceptTermsAndConditionsOnSubmitApplicationPage
        id: bbf54e3f-41f1-4364-9524-874195e1c519
        title: Confirm # TODO discuss with design
        type: CheckboxesField
        list: 94e44f7c-9bb2-4844-8a2c-7f115ff6ba44
        options:
          required: true
        shortDescription: Accept terms and conditions on submit application page
  # 3.3 Confirmation
  - title: Confirmation
    id: ae9f2211-7278-4071-bb66-a7f56f4194df
    path: /confirmation
    controller: ConfirmationPageController
    config:
      panelTitle: 'Application submitted'
      panelText: 'Your application number'
    components:
      - name: confirmationContent
        id: f09c9010-6c65-42c3-9afc-b7d6339d955d
        type: Html
        content: >
          <h2 class="govuk-heading-m">What happens next</h2>
          <p class="govuk-body">Your stage 1 application for a Water Management grant round 3 (WMG R3) has been submitted.</p>
          <p class="govuk-body">We’ll now assess your application against our eligibility criteria and RPA funding priorities. If your stage 1 application is successful, we’ll invite you to  stage 2 of the application process where you will need to show:</p>
          <ul class="govuk-list govuk-list--bullet govuk-!-margin-bottom-6">
            <li>evidence of planning permission</li>
            <li>a plan showing existing and proposed irrigation systems</li>
            <li>evidence of a water abstraction licence (if you need one)</li>
            <li>letters of support from any other farms the project will supply water to</li>
            <li>a letter from your accountant confirming you can pay the remaining project costs</li>
          </ul>
          <p class="govuk-body">The window for stage 1 applications closes at 23.59 on 23 February 2027. The RPA will invite successful applicants to apply for stage 2 soon after that.</p>
          <p class="govuk-body"><a class="govuk-link" href="/{{SLUG}}/print-submitted-application" target="_blank">View / Print submitted application (opens in new tab)</a></p>
  # 3.4 Print application
  - title: PrintSubmittedApplication
    id: 3a5aafef-e492-4db2-9111-42c2e3922aba
    path: /print-submitted-application
    controller: PrintSubmittedApplicationController
  # ==========================================
  # Landing page for return to customer
  # ==========================================

  # =======================================================
  # EXTRA PAGES, only accessible via custom exit conditions
  # =======================================================
  # 1.2.1 EXIT where-project-located when location is not in England
  - title: Your project must be in England
    id: 7cca24be-610e-4c56-8684-928be4cb95c9
    path: /exit-where-project-located # don't change this without changing grants-ui LocationValidateController.getNextPath
    section: 8e00ff98-4e79-4b9d-9913-3694af7f40ca
    controller: TerminalPageController
    components:
      - name: whereProjectLocatedNotInEnglandInfo
        id: 34f0a49a-29cc-43df-8093-8894b81b13ef
        type: Html # TODO update both links
        content: >
          <p class="govuk-body">You cannot apply for this grant because you have selected a location that is not in England.</p>
          <p class="govuk-body">If your project is in England, <a href="/water-management/where-project-located" class="govuk-link">return to the maps page</a> and select the correct location.</p>
          <a href="https://www.gov.uk/government" class="govuk-link" target="_blank">See other grants you may be eligible for</a>
  # 2.3.1 EXIT total-estimated-cost: when minGrantReached=false
  - title: You cannot apply for a grant from this scheme
    id: a57dd815-7b9f-4434-bf27-2d7145e3a4f6
    path: /exit-total-estimated-cost # don't change this without changing grants-ui TotalEstimatedCostController.getNextPath
    section: 922947cc-6c6a-4fe5-b831-da27251663a9
    controller: TerminalPageController
    components:
      - name: totalEstimatedCostMinNotReachedInfo
        id: 0ea6b5ac-be67-4e14-89dc-cfa26bf37e11
        type: Html # TODO update link
        content: >
          {% if itemsPlanningToInstall.size == 1 and itemsPlanningToInstall contains "WATER_STORAGE_TANKS" %}
            <p class="govuk-body">Your costs must be at least £37,500 because the minimum grant is £15,000 (40% of your confirmed costs).</p>
          {% else %}
            <p class="govuk-body">Your costs must be at least £87,500 because the minimum grant is £35,000 (40% of your confirmed costs).</p>
          {% endif %}
          <a href="https://www.gov.uk/find-funding-for-land-or-farms" class="govuk-link" target="_blank"></a>

