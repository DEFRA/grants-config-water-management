    condition: b97db953-3321-4262-bf2f-f72945f26e85
    components:
      - name: workStartedYetBegunWorkInfo
        id: 226da8d4-0485-4ee3-8df6-0434c11bec3a
        type: Html
        content: >
          <p class="govuk-body">You cannot apply for a grant if you have already started work or committed to costs for this project. For information about eligibility criteria, check the <a href="https://www.gov.uk/government/publications/water-management-grant-round-3" class="govuk-link" target="_blank">Water Management grant round 3 guidance (opens in a new tab)</a>.</p>
          <p class="govuk-body"><a href="https://www.gov.uk/government" class="govuk-link" target="_blank">Check what other grants you may be eligible for (opens in a new tab)</a></p>
  # 1.4 Eligible organisation
  - title: Who can apply for this grant
    id: 15768f7d-6c7e-471a-8bf7-118efa9535e5
    path: /eligible-organisation
    section: 8e00ff98-4e79-4b9d-9913-3694af7f40ca
    controller: TaskPageController
    components:
      - name: eligibleOrganisationInfo
        id: 448f0088-240b-4270-844f-0360e6fa868b
        type: Html
        content: >
          <p class="govuk-body">You cannot apply for this grant on behalf of:</p>
          <ul class="govuk-list govuk-list--bullet">
            <li>a government department</li>
            <li>an executive agency</li>
            <li>a non-department public body such as the Environment Agency or the Forestry Commission</li>
            <li>a public body unless it is a local authority, National Park Authority or the Crown Estate</li>
          </ul>
      - name: eligibleOrganisation
        id: 072ea72d-4330-4944-9d85-d0e7655cfcff
